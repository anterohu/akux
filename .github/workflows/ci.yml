name: Akux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testit:
    name: Testit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kokonaisuus
        run: python tests/test_kokonaisuus.py
      - name: Reunatapaukset
        run: python tests/test_reunatapaukset.py
      - name: Sovitin
        run: python tests/test_obdlink.py
      - name: Ylläpito
        run: python tests/test_yllapito.py
      - name: Android-silta
        run: python tests/test_android_silta.py
      - name: Mittaustiedosto
        run: python tests/test_mittaustiedosto.py
      - name: Kaikki automallit
        run: python tests/test_mallit.py

  testityypit:
    name: Testityypit, autot ja akkukemiat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pypdf
      - name: Kaikki testityypit, tauko ja jatko
        run: python tests/test_testityypit.py
      - name: Datan luku ja tarkkuus kaikilla autoilla ja kemioilla
        run: python tests/test_autot_ja_kemiat.py

  windows:
    name: Windows-sovellus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Asenna rakennustyökalut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Lue versio
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
      - name: Rakenna Akux.exe
        run: |
          python -m PyInstaller --noconfirm --clean --log-level WARN --windowed --name Akux `
            --icon akux.ico `
            --add-data "akux\web;akux\web" --add-data "akux\data;akux\data" `
            --hidden-import serial.tools.list_ports --collect-submodules akux --exclude-module tkinter `
            --collect-all webview --hidden-import clr --hidden-import clr_loader --collect-submodules reportlab.graphics `
            --distpath dist --workpath build Akux.pyw
          if (-not (Test-Path dist\Akux\Akux.exe)) { throw "Akux.exe puuttuu" }
      - name: Rakenna asennusohjelma
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DVersio=$env:VERSIO" installer\akux.iss
          if (-not (Test-Path "dist\Akux-asennus-$env:VERSIO.exe")) { throw "Asennusohjelma puuttuu" }
      - name: Asenna, käynnistä ja testaa
        shell: pwsh
        run: |
          $setup = "dist\Akux-asennus-$env:VERSIO.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Asennus epäonnistui ($($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Akux\Akux.exe"
          if (-not (Test-Path $exe)) { throw "Akux.exe puuttuu asennuksen jälkeen" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) "Akux.lnk"))) { throw "Työpöydän pikakuvake puuttuu" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) "Akux.lnk"))) { throw "Käynnistä-valikon pikakuvake puuttuu" }

          function Odota-Akux {
            for ($i = 0; $i -lt 60; $i++) {
              try { $r = Invoke-RestMethod "http://127.0.0.1:8765/api/tila" -TimeoutSec 2; if ($r.nimi -eq "Akux") { return $r } } catch {}
              Start-Sleep 2
            }
            Get-Content (Join-Path $env:APPDATA "Akux\loki.txt") -ErrorAction SilentlyContinue
            throw "Akux ei käynnistynyt"
          }
          $b = "http://127.0.0.1:8765"
          Start-Process $exe
          $r = Odota-Akux
          Write-Host "Akux $($r.versio) käynnissä"
          if ($r.versio -ne $env:VERSIO) { throw "Väärä versio $($r.versio)" }

          # Toinen käynnistys avaa vain uuden sovellusikkunan. Ikkunatesti varmistaa, että
          # Windowsin WebView2-ikkuna aukeaa ja käyttöliittymä latautuu siihen.
          $w = Start-Process $exe -ArgumentList "--ikkunatesti" -PassThru
          $done = $w.WaitForExit(150000)
          Get-Content (Join-Path $env:APPDATA "Akux\loki.txt") -Tail 15 -ErrorAction SilentlyContinue
          if (-not $done) { $w.Kill(); throw "Ikkunatesti ei päättynyt" }
          if ($w.ExitCode -ne 0) { throw "Sovellusikkuna ei avautunut oikein (koodi $($w.ExitCode))" }
          Write-Host "Sovellusikkuna avautui ja käyttöliittymä latautui"

          $q = Invoke-RestMethod "$b/api/yllapito/tarkistus" -TimeoutSec 600
          $q.tarkistukset | ForEach-Object { Write-Host "$($_.nimi): $($_.tila) – $($_.tieto)" }
          if ($q.tarkistukset | Where-Object { $_.tila -eq "virhe" }) { throw "Laaduntarkistuksessa virheitä" }

          Invoke-RestMethod "$b/api/yhdista" -Method Post -ContentType "application/json" -Body '{"tyyppi":"demo","soc":60,"nopeutus":60}' | Out-Null
          for ($i = 0; $i -lt 30; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if ($t.vaylatesti.kunnossa -and $t.live.vin) { break }; Start-Sleep 1 }
          $v = Invoke-RestMethod "$b/api/ajoneuvot" -Method Post -ContentType "application/json" -Body (@{vin=$t.live.vin; rekisteri="CI-1"} | ConvertTo-Json)
          $m = Invoke-RestMethod "$b/api/mittaukset" -Method Post -ContentType "application/json" -Body (@{ajoneuvo_id=$v.id; tyyppi="pikatarkastus"} | ConvertTo-Json)
          for ($i = 0; $i -lt 90; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if (-not $t.mittaus) { break }; Start-Sleep 2 }
          $res = Invoke-RestMethod "$b/api/mittaukset/$($m.id)"
          if ($res.tila -ne "valmis") { throw "Mittaus ei valmistunut: $($res.tila)" }
          Write-Host "Pikatarkastus valmis, kunto $($res.tulos.yhteenveto.kunto_pct) %"
          $folder = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Akux\Mittaukset"
          $saved = Get-ChildItem $folder -ErrorAction SilentlyContinue
          $saved | ForEach-Object { Write-Host "Tallennettu: $($_.Name)" }
          if (-not ($saved | Where-Object { $_.Extension -eq ".akux" })) { throw "Mittaustiedostoa ei tallennettu" }
          if (-not ($saved | Where-Object { $_.Extension -eq ".pdf" })) { throw "Raporttia ei tallennettu" }
          if ($saved | Where-Object { $_.Name -like "*Laaduntarkistus*" }) { throw "Laaduntarkistus tallensi tiedostoja mittauskansioon" }
          if (($saved | Measure-Object).Count -ne 2) { throw "Mittauskansiossa on ylimääräisiä tiedostoja" }
          Copy-Item ($saved | Where-Object { $_.Extension -eq ".pdf" } | Select-Object -First 1).FullName raportti.pdf

          # Päivitys käynnissä olevan ohjelman päälle: ohjelma suljetaan, tiedot säilyvät
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Päivitysasennus epäonnistui ($($p.ExitCode))" }
          Start-Process $exe
          $r = Odota-Akux
          $list = Invoke-RestMethod "$b/api/mittaukset"
          if ($list.mittaukset.Count -lt 1) { throw "Mittaukset hävisivät päivityksessä" }
          Write-Host "Päivitys säilytti $($list.mittaukset.Count) mittausta"

          Invoke-RestMethod "$b/api/sulje" -Method Post -ContentType "application/json" -Body '{}' | Out-Null
          # Palvelin sulkeutuu heti ja sovellusikkuna muutaman sekunnin kuluessa
          # Palvelin ja ikkuna sulkeutuvat heti. Matalan prioriteetin esilatausprosessi voi kylmäkäynnistyksessä
          # olla vielä hetken käynnissä, joten odotetaan enintään minuutti ja näytetään jäljellä olevat prosessit.
          for ($i = 0; $i -lt 60 -and (Get-Process Akux -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Get-CimInstance Win32_Process -Filter "Name='Akux.exe'" | ForEach-Object { Write-Host "Käynnissä: $($_.ProcessId) $($_.CommandLine)" }
          $left = Get-CimInstance Win32_Process -Filter "Name='Akux.exe'" | Where-Object { $_.CommandLine -notlike "*--esilataus*" }
          if ($left) { throw "Akux ei sulkeutunut" }
          Write-Host "Akux sulkeutui $i sekunnissa"
      - name: Ohjelman loki
        if: failure()
        shell: pwsh
        run: Get-Content (Join-Path $env:APPDATA "Akux\loki.txt") -Tail 120 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: Akux-windows
          path: dist/Akux-asennus-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-raportti
          path: raportti.pdf
          if-no-files-found: ignore

  android:
    name: Android-sovellus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Rakenna sovellus
        run: gradle -p android --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Ota emulaattorin kiihdytys käyttöön
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testaa sovellus Android-emulaattorissa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            adb logcat -c || true
            gradle -p android --no-daemon connectedDebugAndroidTest || { echo "=== LOKI ==="; adb logcat -d | grep -iE "akux|python|chaquopy|AndroidRuntime|FATAL|lowmemory|am_kill|died" | tail -n 300; exit 1; }
      - name: Nimeä sovellus
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "Akux-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Akux-android
          path: Akux-*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-testiraportit
          path: android/app/build/reports/
          if-no-files-found: ignore

  julkaisu:
    name: Julkaisu
    runs-on: ubuntu-latest
    needs: [testit, testityypit, windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Akux-android
      - uses: actions/download-artifact@v4
        with:
          name: Akux-windows
      - name: Lue versio
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
          ls -la
      - name: Julkaise
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIO }}
          name: Akux ${{ env.VERSIO }}
          make_latest: true
          body: |
            **Windows:** lataa Akux-asennus-${{ env.VERSIO }}.exe ja avaa se. Jos Windows näyttää ilmoituksen *Windows suojasi tietokonettasi*, valitse Lisätietoja → Suorita silti.

            **Android:** lataa Akux-${{ env.VERSIO }}.apk puhelimeen ja avaa se. Android 10 tai uudempi.

            Päivitys asennetaan samalla tavalla vanhan version päälle. Autot, mittaukset, raportit ja asetukset säilyvät.

            Ennen julkaisua on ajettu kaikki testit, Windows-asennus ja päivitys oikealla Windows-koneella sekä Android-sovelluksen kokonaistesti emulaattorissa.
          files: |
            Akux-*.apk
            Akux-asennus-*.exe
          overwrite_files: true
