name: Akux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testit:
    name: Testit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lukitus
        run: python tests/test_lukitus.py
        timeout-minutes: 2
      - name: Nimenvaihto ja kansioiden siirto
        run: python tests/test_nimenvaihto.py
      - name: Ikkunavahti
        run: python tests/test_ikkunavahti.py
        timeout-minutes: 2
      - name: Kokonaisuus
        run: python tests/test_kokonaisuus.py
      - name: Reunatapaukset
        timeout-minutes: 30
        run: python -u tests/test_reunatapaukset.py
      - name: Sovitin
        run: python tests/test_obdlink.py
      - name: Ylläpito
        run: python tests/test_yllapito.py
      - name: Android-silta
        run: python tests/test_android_silta.py
      - name: Mittaustiedosto
        run: python tests/test_mittaustiedosto.py
      - name: Kaikki automallit
        run: python tests/test_mallit.py

  testityypit:
    name: Testityypit, autot ja akkukemiat
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pypdf
      - name: Kaikki testityypit, tauko ja jatko
        run: python tests/test_testityypit.py
      - name: Datan luku ja tarkkuus kaikilla autoilla ja kemioilla
        run: python tests/test_autot_ja_kemiat.py

  windows:
    name: Windows-sovellus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Asenna rakennustyökalut
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Lue versio
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
      - name: Rakenna AKVERI.exe
        run: |
          python -m PyInstaller --noconfirm --clean --log-level WARN --windowed --name AKVERI `
            --icon akux.ico `
            --add-data "akux\web;akux\web" --add-data "akux\data;akux\data" `
            --hidden-import serial.tools.list_ports --collect-submodules akux --exclude-module tkinter `
            --collect-all webview --hidden-import clr --hidden-import clr_loader --collect-submodules reportlab.graphics `
            --distpath dist --workpath build Akux.pyw
          if (-not (Test-Path dist\AKVERI\AKVERI.exe)) { throw "AKVERI.exe puuttuu" }
      - name: Rakenna asennusohjelma
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DVersio=$env:VERSIO" installer\akux.iss
          if (-not (Test-Path "dist\AKVERI-asennus-$env:VERSIO.exe")) { throw "Asennusohjelma puuttuu" }
      - name: Asenna edellinen julkaistu versio
        # Päivitystesti aidosta lähtötilanteesta: edellinen versio asennetaan ja sillä tehdään mittaus.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo ${{ github.repository }} --json tagName -q .tagName
          if ($tag -eq "v$env:VERSIO") { Write-Host "Edellinen versio on sama kuin tämä, päivitystestiä ei tehdä"; exit 0 }
          gh release download $tag --repo ${{ github.repository }} --pattern "*asennus*.exe" --dir edellinen
          $old = Get-ChildItem edellinen\*.exe | Select-Object -First 1
          Write-Host "Asennetaan $($old.Name)"
          $p = Start-Process $old.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Edellisen version asennus epäonnistui" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Akux\Akux.exe"
          Start-Process $exe
          $b = "http://127.0.0.1:8765"
          for ($i = 0; $i -lt 60; $i++) { try { $r = Invoke-RestMethod "$b/api/tila" -TimeoutSec 2; break } catch { Start-Sleep 2 } }
          Write-Host "Edellinen versio $($r.versio) käynnissä"
          Invoke-RestMethod "$b/api/asetukset" -Method Post -ContentType "application/json" -Body '{"yritys_nimi":"CI Testi Oy"}' | Out-Null
          Invoke-RestMethod "$b/api/yhdista" -Method Post -ContentType "application/json" -Body '{"tyyppi":"demo","soc":60,"nopeutus":60}' | Out-Null
          for ($i = 0; $i -lt 30; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if ($t.vaylatesti.kunnossa -and $t.live.vin) { break }; Start-Sleep 1 }
          $v = Invoke-RestMethod "$b/api/ajoneuvot" -Method Post -ContentType "application/json" -Body (@{vin=$t.live.vin; rekisteri="CI-1"} | ConvertTo-Json)
          $m = Invoke-RestMethod "$b/api/mittaukset" -Method Post -ContentType "application/json" -Body (@{ajoneuvo_id=$v.id; tyyppi="pikatarkastus"} | ConvertTo-Json)
          for ($i = 0; $i -lt 90; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if (-not $t.mittaus) { break }; Start-Sleep 2 }
          if ((Invoke-RestMethod "$b/api/mittaukset/$($m.id)").tila -ne "valmis") { throw "Edellisen version mittaus ei valmistunut" }
          $old_files = Get-ChildItem (Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Akux\Mittaukset")
          $old_files | ForEach-Object { Write-Host "Edellisen version tiedosto: $($_.Name)" }
          if (-not $old_files) { throw "Edellinen versio ei tallentanut mittaustiedostoja" }
          if (-not (Test-Path (Join-Path $env:APPDATA "Akux\akux.db"))) { throw "Edellisen version tietokanta puuttuu" }
          "$($m.id)" | Set-Content edellinen\mittaus.txt
          # Ohjelma jätetään käyntiin: asennuksen pitää sulkea se itse
      - name: Asenna, käynnistä ja testaa
        shell: pwsh
        run: |
          $setup = "dist\AKVERI-asennus-$env:VERSIO.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Asennus epäonnistui ($($p.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\AKVERI\AKVERI.exe"
          if (-not (Test-Path $exe)) { throw "AKVERI.exe puuttuu asennuksen jälkeen" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\Akux")) { throw "Vanha ohjelmakansio Programs\Akux jäi" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) "AKVERI.lnk"))) { throw "Työpöydän pikakuvake puuttuu" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) "AKVERI.lnk"))) { throw "Käynnistä-valikon pikakuvake puuttuu" }
          $vanhat = Get-ChildItem ([Environment]::GetFolderPath('Desktop')), ([Environment]::GetFolderPath('Programs')) -Filter "*.lnk" | Where-Object { $_.Name -like "Akux*" -or $_.Name -like "AKUX*" }
          if ($vanhat) { throw "Vanha pikakuvake jäi: $($vanhat.FullName)" }
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) "AKVERI.lnk"))
          if ($sh.TargetPath -notlike "*\Programs\AKVERI\AKVERI.exe") { throw "Pikakuvake osoittaa väärään ohjelmaan: $($sh.TargetPath)" }

          function Odota-Akux {
            for ($i = 0; $i -lt 60; $i++) {
              try { $r = Invoke-RestMethod "http://127.0.0.1:8765/api/tila" -TimeoutSec 2; if ($r.nimi -eq "AKVERI" -and $r.versio -eq $env:VERSIO) { return $r } } catch {}
              Start-Sleep 2
            }
            Get-Content (Join-Path $env:APPDATA "AKVERI\loki.txt") -ErrorAction SilentlyContinue
            throw "AKVERI ei käynnistynyt"
          }
          $b = "http://127.0.0.1:8765"
          Start-Process $exe
          $r = Odota-Akux
          $docs = [Environment]::GetFolderPath('MyDocuments')
          if (Test-Path edellinen\mittaus.txt) {
            # Edellisen version tiedot siirtyivät AKVERI-kansioihin
            $oid = (Get-Content edellinen\mittaus.txt).Trim()
            if (Test-Path (Join-Path $env:APPDATA "Akux")) { throw "Vanha tietokansio %APPDATA%\Akux jäi siirtämättä" }
            if (-not (Test-Path (Join-Path $env:APPDATA "AKVERI\akux.db"))) { throw "Tietokanta puuttuu kansiosta %APPDATA%\AKVERI" }
            if (Test-Path (Join-Path $docs "Akux")) { throw "Vanha mittauskansio Tiedostot\Akux jäi siirtämättä" }
            if (-not (Get-ChildItem (Join-Path $docs "AKVERI\Mittaukset") -Filter "*.akux")) { throw "Vanhat mittaustiedostot puuttuvat uudesta kansiosta" }
            if (-not ((Invoke-RestMethod "$b/api/ajoneuvot").ajoneuvot | Where-Object { $_.rekisteri -eq "CI-1" })) { throw "Autot hävisivät siirrossa" }
            if ((Invoke-RestMethod "$b/api/asetukset").yritys_nimi -ne "CI Testi Oy") { throw "Asetukset hävisivät siirrossa" }
            $tk = Invoke-RestMethod "$b/api/mittaukset/$oid/tarkista"
            if (-not $tk.ok) { throw "Vanhan mittauksen raakadata ei löydy siirron jälkeen: $($tk.viesti)" }
            $pdf = Invoke-WebRequest "$b/api/mittaukset/$oid/raportti.pdf" -UseBasicParsing
            if ($pdf.StatusCode -ne 200 -or $pdf.RawContentLength -lt 20000) { throw "Vanhan mittauksen raportti ei avaudu siirron jälkeen" }
            Write-Host "Edellisen version tiedot siirtyivät: tietokanta, mittaustiedostot, autot, asetukset ja raakadata"
          }
          Write-Host "AKVERI $($r.versio) käynnissä"
          if ($r.versio -ne $env:VERSIO) { throw "Väärä versio $($r.versio)" }

          # Toinen käynnistys avaa vain uuden sovellusikkunan. Ikkunatesti varmistaa, että
          # Windowsin WebView2-ikkuna aukeaa ja käyttöliittymä latautuu siihen.
          $w = Start-Process $exe -ArgumentList "--ikkunatesti" -PassThru
          $done = $w.WaitForExit(150000)
          Get-Content (Join-Path $env:APPDATA "AKVERI\loki.txt") -Tail 15 -ErrorAction SilentlyContinue
          if (-not $done) { $w.Kill(); throw "Ikkunatesti ei päättynyt" }
          if ($w.ExitCode -ne 0) { throw "Sovellusikkuna ei avautunut oikein (koodi $($w.ExitCode))" }
          Write-Host "Sovellusikkuna avautui ja käyttöliittymä latautui"

          $q = Invoke-RestMethod "$b/api/yllapito/tarkistus" -TimeoutSec 600
          $q.tarkistukset | ForEach-Object { Write-Host "$($_.nimi): $($_.tila) – $($_.tieto)" }
          if ($q.tarkistukset | Where-Object { $_.tila -eq "virhe" }) { throw "Laaduntarkistuksessa virheitä" }

          Invoke-RestMethod "$b/api/asetukset" -Method Post -ContentType "application/json" -Body '{"yritys_nimi":"CI Testi Oy"}' | Out-Null
          Invoke-RestMethod "$b/api/yhdista" -Method Post -ContentType "application/json" -Body '{"tyyppi":"demo","soc":60,"nopeutus":60}' | Out-Null
          for ($i = 0; $i -lt 30; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if ($t.vaylatesti.kunnossa -and $t.live.vin) { break }; Start-Sleep 1 }
          # Edellisen version auto on jo tallennettu, jos päivitystesti tehtiin
          $v = (Invoke-RestMethod "$b/api/ajoneuvot").ajoneuvot | Where-Object { $_.vin -eq $t.live.vin } | Select-Object -First 1
          if (-not $v) { $v = Invoke-RestMethod "$b/api/ajoneuvot" -Method Post -ContentType "application/json" -Body (@{vin=$t.live.vin; rekisteri="CI-1"} | ConvertTo-Json) }
          $m = Invoke-RestMethod "$b/api/mittaukset" -Method Post -ContentType "application/json" -Body (@{ajoneuvo_id=$v.id; tyyppi="pikatarkastus"} | ConvertTo-Json)
          for ($i = 0; $i -lt 90; $i++) { $t = Invoke-RestMethod "$b/api/tila"; if (-not $t.mittaus) { break }; Start-Sleep 2 }
          $res = Invoke-RestMethod "$b/api/mittaukset/$($m.id)"
          if ($res.tila -ne "valmis") { throw "Mittaus ei valmistunut: $($res.tila)" }
          Write-Host "Pikatarkastus valmis, kunto $($res.tulos.yhteenveto.kunto_pct) %"
          $folder = Join-Path $docs "AKVERI\Mittaukset"
          $saved = Get-ChildItem $folder -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*_$('{0:D5}' -f [int]$m.id).*" }
          $saved | ForEach-Object { Write-Host "Tallennettu: $($_.Name)" }
          if (-not ($saved | Where-Object { $_.Extension -eq ".akveri" })) { throw "Mittaustiedostoa ei tallennettu" }
          if (-not ($saved | Where-Object { $_.Extension -eq ".pdf" })) { throw "Raporttia ei tallennettu" }
          if (Get-ChildItem $folder | Where-Object { $_.Name -like "*Laaduntarkistus*" }) { throw "Laaduntarkistus tallensi tiedostoja mittauskansioon" }
          if (($saved | Measure-Object).Count -ne 2) { throw "Mittauskansiossa on ylimääräisiä tiedostoja" }
          Copy-Item ($saved | Where-Object { $_.Extension -eq ".pdf" } | Select-Object -First 1).FullName raportti.pdf

          # Päivitys käynnissä olevan ohjelman päälle: ohjelma suljetaan, tiedot säilyvät.
          # Aiemman nimen pikakuvakkeet jäljitellään, jotta nähdään, että päivitys poistaa ne.
          foreach ($d in ([Environment]::GetFolderPath('Desktop')), ([Environment]::GetFolderPath('Programs'))) {
            Copy-Item (Join-Path $d "AKVERI.lnk") (Join-Path $d "AKUX.lnk")
          }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Päivitysasennus epäonnistui ($($p.ExitCode))" }
          Start-Process $exe
          $r = Odota-Akux
          $list = Invoke-RestMethod "$b/api/mittaukset"
          if ($list.mittaukset.Count -lt 1) { throw "Mittaukset hävisivät päivityksessä" }
          $autot = Invoke-RestMethod "$b/api/ajoneuvot"
          if (-not ($autot.ajoneuvot | Where-Object { $_.rekisteri -eq "CI-1" })) { throw "Autot hävisivät päivityksessä" }
          $as = Invoke-RestMethod "$b/api/asetukset"
          if ($as.yritys_nimi -ne "CI Testi Oy") { throw "Asetukset hävisivät päivityksessä" }
          $pdf = Invoke-WebRequest "$b/api/mittaukset/$($m.id)/raportti.pdf" -UseBasicParsing
          if ($pdf.StatusCode -ne 200 -or $pdf.RawContentLength -lt 20000) { throw "Vanhan mittauksen raportti ei avaudu päivityksen jälkeen" }
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Desktop')), ([Environment]::GetFolderPath('Programs')) -Filter "*.lnk" | Where-Object { $_.Name -like "AKUX*" }
          if ($lnk) { throw "Vanha pikakuvake jäi: $($lnk.FullName)" }
          Write-Host "Päivitys säilytti $($list.mittaukset.Count) mittausta, autot, asetukset ja raportit"

          Invoke-RestMethod "$b/api/sulje" -Method Post -ContentType "application/json" -Body '{}' | Out-Null
          # Palvelin sulkeutuu heti ja sovellusikkuna muutaman sekunnin kuluessa
          # Palvelin ja ikkuna sulkeutuvat heti. Matalan prioriteetin esilatausprosessi voi kylmäkäynnistyksessä
          # olla vielä hetken käynnissä, joten odotetaan enintään minuutti ja näytetään jäljellä olevat prosessit.
          for ($i = 0; $i -lt 60 -and (Get-Process AKVERI -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Get-CimInstance Win32_Process -Filter "Name='AKVERI.exe'" | ForEach-Object { Write-Host "Käynnissä: $($_.ProcessId) $($_.CommandLine)" }
          $left = Get-CimInstance Win32_Process -Filter "Name='AKVERI.exe'" | Where-Object { $_.CommandLine -notlike "*--esilataus*" }
          if ($left) { throw "AKVERI ei sulkeutunut" }
          Write-Host "AKVERI sulkeutui $i sekunnissa"
      - name: Ohjelman loki
        if: failure()
        shell: pwsh
        run: |
          Get-Content (Join-Path $env:APPDATA "AKVERI\loki.txt") -Tail 120 -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:APPDATA "Akux\loki.txt") -Tail 40 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: Akux-windows
          path: dist/AKVERI-asennus-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-raportti
          path: raportti.pdf
          if-no-files-found: ignore

  android:
    name: Android-sovellus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Rakenna sovellus
        run: gradle -p android --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Ota emulaattorin kiihdytys käyttöön
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testaa sovellus Android-emulaattorissa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            adb logcat -c || true
            gradle -p android --no-daemon connectedDebugAndroidTest || { echo "=== LOKI ==="; adb logcat -d | grep -iE "akux|python|chaquopy|AndroidRuntime|FATAL|lowmemory|am_kill|died" | tail -n 300; exit 1; }
      - name: Nimeä sovellus
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "AKVERI-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Akux-android
          path: AKVERI-*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-testiraportit
          path: android/app/build/reports/
          if-no-files-found: ignore

  julkaisu:
    name: Julkaisu
    runs-on: ubuntu-latest
    needs: [testit, testityypit, windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Akux-android
      - uses: actions/download-artifact@v4
        with:
          name: Akux-windows
      - name: Lue versio
        run: |
          V=$(python3 -c "import re;print(re.search(r'VERSIO = \"([^\"]+)\"', open('akux/__init__.py').read()).group(1))")
          echo "VERSIO=$V" >> $GITHUB_ENV
          ls -la
      - name: Julkaise
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIO }}
          name: AKVERI ${{ env.VERSIO }}
          make_latest: true
          body: |
            **Windows:** lataa AKVERI-asennus-${{ env.VERSIO }}.exe ja avaa se. Jos Windows näyttää ilmoituksen *Windows suojasi tietokonettasi*, valitse Lisätietoja → Suorita silti.

            **Android:** lataa AKVERI-${{ env.VERSIO }}.apk puhelimeen ja avaa se. Android 10 tai uudempi.

            Päivitys asennetaan samalla tavalla vanhan version päälle. Autot, mittaukset, raportit ja asetukset säilyvät.

            Ennen julkaisua on ajettu kaikki testit, Windows-asennus ja päivitys oikealla Windows-koneella sekä Android-sovelluksen kokonaistesti emulaattorissa.
          files: |
            AKVERI-*.apk
            AKVERI-asennus-*.exe
          overwrite_files: true
